[pytest]
testpaths =
    tests/project
    phases/backend/phase-01-source-knowledge-foundation/tests
    phases/backend/phase-02-scale-india-corpus/tests
    phases/backend/phase-03-embeddings-vector-store/tests
    phases/backend/phase-04-scheduler/tests
    phases/backend/phase-05-rag-chat-api/tests
    phases/backend/phase-06-query-routing/tests
    phases/backend/phase-07-hybrid-retrieval/tests
    phases/backend/phase-08-conversation/tests
    phases/backend/phase-09-comparison-recommendations/tests
    phases/backend/phase-10-rag-evaluation/tests
pythonpath =
    .
    phases/backend/phase-01-source-knowledge-foundation/scripts
    phases/backend/phase-02-scale-india-corpus/scripts
    phases/backend/phase-03-embeddings-vector-store/scripts
    phases/backend/phase-04-scheduler/scripts
    phases/backend/phase-05-rag-chat-api/scripts
    phases/backend/phase-06-query-routing/scripts
    phases/backend/phase-07-hybrid-retrieval/scripts
    phases/backend/phase-08-conversation/scripts
    phases/backend/phase-09-comparison-recommendations/scripts
    phases/backend/phase-10-rag-evaluation/scripts
markers =
    integration: live embedding/Groq/Postgres tests (set TRIPWISE_RUN_INTEGRATION=1)
filterwarnings =
    ignore::FutureWarning
    ignore:.*urllib3 v2 only supports OpenSSL.*
    ignore::pydantic.warnings.PydanticDeprecatedSince212
    ignore::pydantic.warnings.PydanticDeprecationWarning
addopts = -q
